{% extends 'base.html' %}{% block body %}<h1>Company workspace</h1><section class="card"><h2>Add a company</h2><form method="post" action="/company"><label>Company name <input name="name" required></label><label>Website <input name="url" type="url" placeholder="https://" required></label><button>Research company</button></form></section><div class="grid">{% for p in companies %}<article><h2><a href="/c/{{p.id}}">{{p.name}}</a></h2><small>{{p.url}}</small></article>{% endfor %}</div>{% endblock %}
